<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nil Kirilli • Model Review</title><style>body{margin:0;background:#142333;color:white;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;top:20px;left:20px;display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #77a7c1;background:#153b55;color:white;border-radius:8px;padding:10px 16px;cursor:pointer}aside{position:fixed;bottom:20px;left:20px}h1{font-size:22px;margin:0 0 6px}p{margin:0;color:#a9cfdf}</style></head><body><canvas id="preview"></canvas><nav><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="rear">Rear</button><button data-view="driver">Driver</button><button data-view="cabin">Cabin</button><button id="night">Day / Night</button></nav><aside><h1>Nil Kirilli / Blue Chick 02</h1><p id="status">Loading bus…</p></aside><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {Bus} from '../src/bus.js';import {createCockpit} from '../src/cockpit.js';import {loadRearTextFont} from '../src/rear-text.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#7b9cad');
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.035,100);const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const hemi=new THREE.HemisphereLight('#eaf5ff','#607687',3);scene.add(hemi);const sun=new THREE.DirectionalLight('#fff1dc',4);sun.position.set(-8,12,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#5a7180',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const bus=new Bus({color:'#148ddd',accent:'#e9d399',name:'NIL KIRILLI',destination:'99 • BLUE CHICK 02'});bus.cockpit=createCockpit();bus.group.add(bus.cockpit);scene.add(bus.group);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);
const views={front:[[8,4.5,13],[0,1.7,1.2]],side:[[15,4,0],[0,1.8,0]],rear:[[-8,4,-13],[0,1.8,-1]],driver:[[-.513,2.365,4.105],[-.513,2.1,15]],cabin:[[0,2.4,-4.66],[0,2.28,3.8]]};
function view(name){camera.fov=['driver','cabin'].includes(name)?68:48;camera.updateProjectionMatrix();camera.position.set(...views[name][0]);controls.target.set(...views[name][1]);controls.update();}view('front');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));let night=false;document.querySelector('#night').onclick=()=>{night=!night;hemi.intensity=night?.75:3;sun.intensity=night?.2:4;scene.background.set(night?'#071527':'#7b9cad');render();};
await bus.ready;render();loadRearTextFont().then(render);document.querySelector('#status').textContent='Drag to orbit • Scroll to zoom • Front / Side / Rear / Driver / Cabin';
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});
</script></body></html>
