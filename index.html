<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18241e" />
    <meta name="description" content="Your bus. Your friends. The scenic route. A customizable multiplayer driving game." />
    <title>BUS CLUB — Take the scenic route</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" /></noscript>
    <link rel="preload" href="/src/assets/sri-lanka-bus.glb" as="fetch" crossorigin fetchpriority="low" />
    <link rel="preload" href="/src/assets/nil-kirilli-mural.jpg" as="image" crossorigin fetchpriority="low" />
  </head>
  <body>
    <canvas id="game" aria-label="Scenic three-dimensional bus driving world"></canvas>
    <div class="world-shade" aria-hidden="true"></div>
    <div id="ui"></div>
    <div id="loading-status" role="status">Finding the scenic route<span>Preparing your bus…</span></div>
    <div id="error-status" role="alert" hidden></div>
    <script type="module" src="/src/main.js"></script>
